[project]
name = "image-converter"
version = "1.0.2"
description = "A clean desktop app for batch renaming and converting images - fast, safe filenames, and predictable results."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "nondeletable" }]
dependencies = [
    "flet==0.28.3",
    "pillow==10.4.0",
]

[project.urls]
Homepage = "https://github.com/nondeletable/Image-Converter"
Repository = "https://github.com/nondeletable/Image-Converter"
Issues = "https://github.com/nondeletable/Image-Converter/issues"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E","F","I","W","UP","B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ui","utils"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
